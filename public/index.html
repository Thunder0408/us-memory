<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Us Memory ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>
  <!-- Delete confirmation modal -->
  <div id="confirm-modal" class="confirm-modal" style="display:none">
    <div class="confirm-box">
      <div class="confirm-icon"><i class="fa-solid fa-trash"></i></div>
      <p class="confirm-message" id="confirm-message">Delete this photo/video?</p>
      <div class="confirm-actions">
        <button class="btn btn-ghost" id="confirm-no">Cancel</button>
        <button class="btn btn-danger" id="confirm-yes">Delete</button>
      </div>
    </div>
  </div>

  <div id="lightbox" class="lightbox hidden">
    <button class="lightbox-close" onclick="closeLightbox()"><i class="fa-solid fa-xmark"></i></button>
    <button class="lightbox-prev" onclick="lightboxNav(-1)"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="lightbox-content" id="lightbox-content"></div>
    <button class="lightbox-next" onclick="lightboxNav(1)"><i class="fa-solid fa-chevron-right"></i></button>
  </div>
  <script src="app.js"></script>

  <!-- YouTube IFrame Player API — must load after DOM -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <!-- Offscreen YouTube player target (1×1px, off-screen) -->
  <div id="yt-player" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;pointer-events:none;"></div>
  <!-- Music widget overlay — rendered by app.js, outside #app so it survives navigation -->
  <div id="music-widget"></div>
</body>
</html>
